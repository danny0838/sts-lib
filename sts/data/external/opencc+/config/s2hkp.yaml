name: Simplified Chinese to Traditional Chinese (Hong Kong variant, with phrases)
requires:
- _default.yaml
dicts:
- file: ../dictionary/s2hkp.tlist
  auto_space: true
  mode: join
  src:
  - mode: load
    src:
    - ../dictionary/STPhrases.list
    - ../dictionary/STCharacters.list
  - mode: load
    src:
    - ../dictionary/HKPhrases.list
    - ../dictionary/HKVariantsPhrases.list
    - ../dictionary/HKVariants.list
